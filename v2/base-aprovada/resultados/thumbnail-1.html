<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#000}.card{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff}@font-face{font-family:TipoNinja;src:url('../recursos/TipoNinja-Regular.otf')}.foto{position:absolute;overflow:hidden}.foto img{width:100%;height:100%;object-fit:cover}.escurecimento{position:absolute;inset:0;background:rgba(0,0,0,0.05)}.protecaologo{position:absolute;inset:0;background:linear-gradient(45deg,transparent calc(100% - 340px),rgba(0,0,0,0.3) 100%)}.gradient{position:absolute;inset:0;background:linear-gradient(transparent var(--fade-top),#000 1080px)}.headline{position:absolute;left:60px;right:60px;bottom:60px;margin:0;font:400 170px/1 TipoNinja;text-transform:uppercase;letter-spacing:0}.signature{position:absolute;top:60px;right:60px;width:132px;height:auto}.hat,.headline{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0,"clig" 0,"dlig" 0,"hlig" 0,"salt" 0,"swsh" 0,"cswh" 0,"titl" 0,"ss01" 0,"ss02" 0,"ss03" 0,"ss04" 0,"ss05" 0,"ss06" 0,"ss07" 0,"ss08" 0,"ss09" 0,"ss10" 0,"ss11" 0,"ss12" 0,"ss13" 0,"ss14" 0,"ss15" 0,"ss16" 0,"ss17" 0,"ss18" 0,"ss19" 0,"ss20" 0}</style><article class="card"><div class="foto" style="left:0px;top:0px;width:1920px;height:1080px"><img src="../recursos/comunicacao.jpg" style="object-position:50% 45%"></div><div class="escurecimento"></div><div class="protecaologo"></div><div class="gradient"></div><h1 class="headline"><span style="display:block;white-space:nowrap">POVOS INDÍGENAS:</span><span style="display:block;white-space:nowrap">TERRITÓRIO, CULTURA</span><span style="display:block;white-space:nowrap">E COMUNICAÇÃO</span></h1><img class="signature" src="../recursos/ninja-letreiro-branco.png" alt="NINJA"></article><script>function ajustar(){const c=document.querySelector('.card'),base=c.getBoundingClientRect();const a=document.querySelector('.headline');c.style.setProperty('--fade-top',Math.max(0,a.getBoundingClientRect().top-base.top-80)+'px');c.style.setProperty('--fade-bottom',(document.querySelector('.photo')?.getBoundingClientRect().bottom-base.top)+'px')}document.fonts.ready.then(ajustar);new ResizeObserver(ajustar).observe(document.querySelector('.headline'));</script></html>
